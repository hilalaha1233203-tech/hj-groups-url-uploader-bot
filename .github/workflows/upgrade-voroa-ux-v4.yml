name: Upgrade Voroa UX V4
on:
  push:
    branches: [main]
jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[skip voroa-ux]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source patch
        run: python .github/scripts/upgrade_voroa_ux.py
      - name: Patch Playbook callback API
        run: python .github/scripts/patch_playbook_progress.py
      - name: Compile all Python
        run: python -m py_compile start.py telegram_bot.py telegram_session_store.py playbook_client.py
      - name: 100x isolated function regression test
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source = Path('telegram_bot.py').read_text(encoding='utf-8')
          tree = ast.parse(source)
          wanted = {'parse_link', 'parse_bulk_link', 'format_eta'}
          nodes = [n for n in tree.body if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef)) and n.name in wanted]
          code = compile(ast.Module(body=nodes, type_ignores=[]), 'telegram_bot_subset.py', 'exec')
          ns = {'re': __import__('re'), 'MAX_BULK_MESSAGES': 500}
          exec(code, ns)
          assert ns['parse_bulk_link']('https://t.me/c/4433695631/471-480') == ('-1004433695631', 471, 480)
          assert ns['parse_bulk_link']('https://t.me/c/4433695631/471 480') == ('-1004433695631', 471, 480)
          assert ns['parse_bulk_link']('https://t.me/c/4433695631/471') is None
          assert ns['parse_link']('https://t.me/c/4433695631/471') == ('-1004433695631', 471)
          assert ns['format_eta'](4) == '4s left'
          assert ns['format_eta'](3) == '3s left'
          for _ in range(100):
              assert ns['parse_bulk_link']('https://t.me/c/4433695631/471-480') == ('-1004433695631', 471, 480)
              assert ns['parse_bulk_link']('https://t.me/c/4433695631/471 480') == ('-1004433695631', 471, 480)
          print('100x isolated parser regression test passed.')
          PY
      - name: Source audit
        run: |
          python - <<'PY'
          from pathlib import Path
          bot = Path('telegram_bot.py').read_text(encoding='utf-8')
          store = Path('telegram_session_store.py').read_text(encoding='utf-8')
          playbook = Path('playbook_client.py').read_text(encoding='utf-8')
          for x in ['DESTINATIONS = {}', 'async def load_destination(uid)', 'async def set_destination(uid, dest)', 'def safe_filename(msg):', 'def format_eta(seconds):', 'progress_callback', 'Permanent destination saved', 'Scan timed out after 35 seconds']:
              assert x in bot, x
          assert 'async def get_destination(self, user_id: int)' in store
          assert 'async def set_destination(self, user_id: int, destination: str)' in store
          assert 'progress_callback=None' in playbook
          print('Source audit passed.')
          PY
      - name: Commit validated source only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_bot.py telegram_session_store.py playbook_client.py
          git reset -- .github/scripts/upgrade_voroa_ux.py .github/scripts/patch_playbook_progress.py .github/workflows/upgrade-voroa-ux.yml .github/workflows/upgrade-voroa-ux-v2.yml .github/workflows/upgrade-voroa-ux-v3.yml .github/workflows/upgrade-voroa-ux-v4.yml
          git diff --cached --check
          git commit -m "Harden destination persistence and transfer progress [skip voroa-ux]"
          git push
