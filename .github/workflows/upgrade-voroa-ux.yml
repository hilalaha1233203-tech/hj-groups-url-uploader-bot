name: Upgrade Voroa UX
on:
  push:
    branches: [main]

jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[skip voroa-ux]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply upgrade
        run: python .github/scripts/upgrade_voroa_ux.py
      - name: Compile source
        run: python -m py_compile start.py telegram_bot.py telegram_session_store.py playbook_client.py
      - name: 100x parser regression check
        run: |
          python - <<'PY'
          import importlib.util
          import telegram_bot as tb
          for _ in range(100):
              assert tb.parse_bulk_link('https://t.me/c/4433695631/471-480') == ('-1004433695631', 471, 480)
              assert tb.parse_bulk_link('https://t.me/c/4433695631/471 480') == ('-1004433695631', 471, 480)
              assert tb.parse_bulk_link('https://t.me/c/4433695631/471') is None
              assert tb.parse_link('https://t.me/c/4433695631/471') == ('-1004433695631', 471)
          print('100x parser regression check passed.')
          PY
      - name: Source invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          bot = Path('telegram_bot.py').read_text(encoding='utf-8')
          store = Path('telegram_session_store.py').read_text(encoding='utf-8')
          required = [
              'async def load_destination(uid)',
              'async def set_destination(uid, dest)',
              'DESTINATIONS = {}',
              'format_eta(seconds)',
              'progress_callback',
              'safe_filename(msg)',
              'Scan timed out after 35 seconds',
              'await asyncio.wait_for(resolve_message_peer(peer), timeout=SCAN_TIMEOUT_SECONDS)',
          ]
          for value in required:
              assert value in bot, value
          for value in ['async def get_destination(self, user_id: int)', 'async def set_destination(self, user_id: int, destination: str)']:
              assert value in store, value
          print('Source invariants passed.')
          PY
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_bot.py telegram_session_store.py
          git reset -- .github/scripts/upgrade_voroa_ux.py .github/workflows/upgrade-voroa-ux.yml
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Harden destination persistence and transfer progress [skip voroa-ux]"
          git push
