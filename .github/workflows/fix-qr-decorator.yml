name: Fix QR handler
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Fix QR handler'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/scripts/fix_qr_decorator.py
      - run: python -m py_compile start.py telegram_bot.py telegram_session_store.py playbook_client.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/scripts/fix_qr_decorator.py .github/workflows/fix-qr-decorator.yml
          git add telegram_bot.py .github/scripts/fix_qr_decorator.py .github/workflows/fix-qr-decorator.yml
          git commit -m 'Fix QR handler'
          git push
