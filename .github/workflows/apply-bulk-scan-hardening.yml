name: Apply bulk scan hardening
on:
  push:
    paths:
      - '.github/scripts/harden_bulk_scan.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python .github/scripts/harden_bulk_scan.py
      - run: python -m py_compile start.py telegram_bot.py telegram_session_store.py playbook_client.py
      - run: git diff --check
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_bot.py
          git commit -m 'Harden bulk scan timeout handling' || exit 0
          git push
