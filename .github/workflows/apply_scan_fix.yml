name: Apply scan fix
on:
  push:
    paths:
      - .github/scripts/fix_scan_hang.py
      - .github/workflows/apply_scan_fix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python .github/scripts/fix_scan_hang.py
      - name: Validate
        run: python -m py_compile telegram_bot.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_bot.py
          git diff --cached --quiet || git commit -m 'Fix Telegram message scan hang'
          git push
      - name: Remove patch helper
        run: |
          rm -f .github/scripts/fix_scan_hang.py .github/workflows/apply_scan_fix.yml
          git add -A
          git diff --cached --quiet || git commit -m 'Remove one-time scan patch workflow'
          git push
