name: Patch QR 2FA isolation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Patch QR 2FA isolation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python .github/scripts/patch_qr_2fa_isolation.py
      - name: Validate Python
        run: python -m py_compile start.py telegram_bot.py telegram_session_store.py playbook_client.py
      - name: Remove one-time tooling and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/scripts/patch_qr_2fa_isolation.py .github/workflows/patch-qr-2fa-isolation.yml
          git add telegram_bot.py .github/scripts/patch_qr_2fa_isolation.py .github/workflows/patch-qr-2fa-isolation.yml
          git commit -m 'Patch QR 2FA isolation'
          git push
