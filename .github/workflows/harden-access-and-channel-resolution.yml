name: Harden owner VIP access and channel resolution

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch Telegram access model and resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('telegram_bot.py')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'from telethon.sessions import StringSession\n',
              'from telethon.sessions import StringSession\nfrom telethon import utils\n',
              1,
          )

          old_allowed = '''def allowed(uid):
              if not uid:
                  return False
              uid = int(uid)
              if OWNER_USER_ID and uid == OWNER_USER_ID:
                  return True
              record = ACCESS_CACHE.get(uid)
              if not record or not record.get("active", False):
                  return False
              expires_at = record.get("expires_at")
              if expires_at is None:
                  return True
              if isinstance(expires_at, str):
                  try:
                      expires_at = datetime.fromisoformat(expires_at.replace("Z", "+00:00"))
                  except ValueError:
                      return False
              if expires_at.tzinfo is None:
                  expires_at = expires_at.replace(tzinfo=timezone.utc)
              return datetime.now(timezone.utc) < expires_at
'''
          new_allowed = '''def access_role(uid):
              if not uid:
                  return None
              uid = int(uid)
              if OWNER_USER_ID and uid == OWNER_USER_ID:
                  return "owner"
              record = ACCESS_CACHE.get(uid)
              if not record or not record.get("active", False):
                  return None
              expires_at = record.get("expires_at")
              if expires_at is not None:
                  if isinstance(expires_at, str):
                      try:
                          expires_at = datetime.fromisoformat(expires_at.replace("Z", "+00:00"))
                      except ValueError:
                          return None
                  if expires_at.tzinfo is None:
                      expires_at = expires_at.replace(tzinfo=timezone.utc)
                  if datetime.now(timezone.utc) >= expires_at:
                      return None
              return str(record.get("role", "vip")).lower()

          def allowed(uid):
              return access_role(uid) in {"owner", "vip", "user"}

          def is_owner(uid):
              return access_role(uid) == "owner"
'''
          if old_allowed not in s:
              raise SystemExit('allowed block not found')
          s = s.replace(old_allowed, new_allowed, 1)

          old_resolver = '''async def resolve_message_peer(peer):
              try:
                  return await asyncio.wait_for(user_client.get_input_entity(peer), timeout=SCAN_TIMEOUT_SECONDS)
              except (ValueError, TypeError):
                  target_id = int(peer) if str(peer).lstrip("-").isdigit() else None
                  if target_id is None:
                      return await asyncio.wait_for(user_client.get_entity(peer), timeout=SCAN_TIMEOUT_SECONDS)
                  async def find_in_dialogs():
                      async for dialog in user_client.iter_dialogs():
                          entity = getattr(dialog, "entity", None)
                          if entity is not None and getattr(entity, "id", None) == abs(target_id) and getattr(dialog, "id", None) == target_id:
                              return entity
                      return None
                  entity = await asyncio.wait_for(find_in_dialogs(), timeout=SCAN_TIMEOUT_SECONDS)
                  if entity is None:
                      raise ValueError(f"Telegram channel/chat {peer} is not in the logged-in account's dialogs. Make sure the account has access to that channel.")
                  return entity
'''
          new_resolver = '''async def resolve_message_peer(peer):
              try:
                  return await asyncio.wait_for(user_client.get_input_entity(peer), timeout=SCAN_TIMEOUT_SECONDS)
              except (ValueError, TypeError, KeyError):
                  target_text = str(peer).strip()
                  target_id = int(target_text) if target_text.lstrip("-").isdigit() else None
                  if target_id is None:
                      return await asyncio.wait_for(user_client.get_entity(target_text), timeout=SCAN_TIMEOUT_SECONDS)

                  # Telegram public/private channel IDs are marked as -100... in
                  # message links. Convert that marked ID to Telethon's PeerChannel
                  # rather than relying on the entity cache or comparing raw IDs.
                  raw_id, peer_cls = utils.resolve_id(target_id)
                  if peer_cls is not None:
                      try:
                          return await asyncio.wait_for(
                              user_client.get_input_entity(peer_cls(raw_id)),
                              timeout=SCAN_TIMEOUT_SECONDS,
                          )
                      except (ValueError, TypeError, KeyError):
                          pass

                  async def find_in_dialogs():
                      async for dialog in user_client.iter_dialogs():
                          entity = getattr(dialog, "entity", None)
                          if entity is None:
                              continue
                          try:
                              if utils.get_peer_id(entity, add_mark=True) == target_id:
                                  return entity
                          except Exception:
                              continue
                      return None

                  entity = await asyncio.wait_for(find_in_dialogs(), timeout=SCAN_TIMEOUT_SECONDS)
                  if entity is None:
                      raise ValueError(
                          f"Telegram channel/chat {peer} is not accessible from the logged-in account. "
                          "The account must be a member of the channel and the channel must be visible in Telegram."
                      )
                  return entity
'''
          if old_resolver not in s:
              raise SystemExit('resolver block not found')
          s = s.replace(old_resolver, new_resolver, 1)

          # Owner-only command checks.
          s = s.replace('if uid != OWNER_USER_ID:\n        return await message.answer("⛔ Owner only.")', 'if not is_owner(uid):\n        return await message.answer("⛔ Owner only.")')

          # VIP role for /grant; users still get normal bot functions only.
          s = s.replace('await session_store.set_access(target, active=True, expires_at=expiry, role="user")', 'await session_store.set_access(target, active=True, expires_at=expiry, role="vip")', 2)
          s = s.replace('ACCESS_CACHE[target] = {"user_id": target, "active": True, "expires_at": expiry, "role": "user"}', 'ACCESS_CACHE[target] = {"user_id": target, "active": True, "expires_at": expiry, "role": "vip"}', 2)
          s = s.replace('status = "ACTIVE / PERMANENT"', 'status = "VIP / PERMANENT"')
          s = s.replace('status = f"ACTIVE / {row[\'expires_at\']}"', 'status = f"VIP / {row[\'expires_at\']}"')
          s = s.replace('role="user")\n            ACCESS_CACHE[uid] = {"user_id": uid, "active": True, "expires_at": None, "role": "user"}', 'role="vip")\n            ACCESS_CACHE[uid] = {"user_id": uid, "active": True, "expires_at": None, "role": "vip"}', 1)

          # Add a safe user-ID command so the owner can configure VOROA_OWNER_USER_ID.
          marker = '@dp.message(Command("help"))\n'
          handler = '''@dp.message(Command("id"))
          async def id_cmd(message: Message):
              uid = message.from_user.id if message.from_user else None
              if not uid:
                  return
              role = access_role(uid) or "not authorized"
              await message.answer(f"🆔 Your Telegram user ID: {uid}\\n\\nRole: {role}", reply_markup=menu())

          @dp.message(Command("help"))
'''
          if marker in s and '@dp.message(Command("id"))' not in s:
              s = s.replace(marker, handler, 1)

          # Mention /id in command menu and help text.
          s = s.replace('BotCommand(command="start", description="Open main menu"), BotCommand(command="help", description="Show help"),', 'BotCommand(command="start", description="Open main menu"), BotCommand(command="id", description="Show your Telegram user ID"), BotCommand(command="help", description="Show help"),', 1)
          s = s.replace('send a Telegram message link directly.', 'send a Telegram message link directly.\\n\\nUse /id to see your Telegram user ID.', 1)

          compile(s, 'telegram_bot.py', 'exec')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Update environment example
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.env.telegram-media.example')
          s = p.read_text(encoding='utf-8')
          if 'VOROA_OWNER_USER_ID' not in s:
              s += '\n# Telegram user ID of the bot owner (get it with /id in the bot)\nVOROA_OWNER_USER_ID=YOUR_OWNER_TELEGRAM_USER_ID\n'
              p.write_text(s, encoding='utf-8')
          PY
      - name: Smoke check and 100x parser regression
        run: python smoke_test.py
      - name: Compile all Telegram files
        run: python -m py_compile start.py telegram_bot.py telegram_session_store.py playbook_client.py smoke_test.py
      - name: Commit hardened patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_bot.py .env.telegram-media.example
          git commit -m 'Harden owner VIP roles and private channel resolution' || true
          git rm .github/workflows/harden-access-and-channel-resolution.yml
          git commit -m 'Remove one-time access hardening workflow'
          git push
