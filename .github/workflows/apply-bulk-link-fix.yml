name: Apply bulk Telegram link fix
on:
  push:
    branches: [main]

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip bulk-link-fix]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply patch
        run: python .github/scripts/apply_bulk_link_fix.py
      - name: Validate
        run: python -m py_compile start.py telegram_bot.py telegram_session_store.py playbook_client.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_bot.py
          git reset -- .github/scripts/apply_bulk_link_fix.py .github/workflows/apply-bulk-link-fix.yml
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Add bulk Telegram link support [skip bulk-link-fix]"
          git push
