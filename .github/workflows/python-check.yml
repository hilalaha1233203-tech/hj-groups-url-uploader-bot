name: Voroa CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile current Voroa Python files
        run: python -m py_compile voroa_stable.py voroa_launcher.py voroa_stable_test.py smoke_test.py generate_telethon_session.py

      - name: Run stable core tests
        env:
          TELEGRAM_API_ID: '12345'
          TELEGRAM_API_HASH: 'ci_entrypoint_test_hash'
          TELEGRAM_BOT_TOKEN: '123456:ci_entrypoint_test_token'
        run: python voroa_stable_test.py

      - name: Import production entrypoints without starting polling
        env:
          TELEGRAM_API_ID: '12345'
          TELEGRAM_API_HASH: 'ci_entrypoint_test_hash'
          TELEGRAM_BOT_TOKEN: '123456:ci_entrypoint_test_token'
        run: python -c "import voroa_stable; import voroa_launcher; print('Voroa production imports: PASS')"

      - name: Run Voroa smoke regression
        env:
          TELEGRAM_API_ID: '12345'
          TELEGRAM_API_HASH: 'ci_entrypoint_test_hash'
          TELEGRAM_BOT_TOKEN: '123456:ci_entrypoint_test_token'
        run: python smoke_test.py
